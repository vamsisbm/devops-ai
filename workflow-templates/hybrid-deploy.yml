name: Hybrid Deploy (Cloud + On-Prem)
on:
  push: { branches: [main] }
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION:          us-east-2
  ECR_REPOSITORY:      my-lab-agent
  ONPREM_INSTANCE_ID:  "mi-YOUR_INSTANCE_ID"
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsAgentRole
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --push ./agent
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy-cloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsAgentRole
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          npm install -g @aws/agentcore
          agentcore deploy --runtime-name my-lab-agent \
            --image-uri ${{ needs.build.outputs.image }}
  deploy-onprem:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsAgentRole
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids  ${{ env.ONPREM_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters    commands=["/opt/deploy/deploy_onprem.sh ${{ needs.build.outputs.image }}"] \
            --region        ${{ env.AWS_REGION }} \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id  $COMMAND_ID \
            --instance-id ${{ env.ONPREM_INSTANCE_ID }} \
            --region      ${{ env.AWS_REGION }}
