name: Deploy RAG Agent
on:
  push:        { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  id-token: write
  contents: read
  pull-requests: write
env:
  AWS_REGION:       us-east-2
  ECR_REPOSITORY:   my-lab-agent
  KB_ID:            "YOUR_KNOWLEDGE_BASE_ID"
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsAgentRole
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --push ./agent
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
  evaluate-and-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsAgentRole
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install boto3
      - run: python evaluation/run_eval.py --kb-id ${{ env.KB_ID }}
      - if: success()
        run: |
          npm install -g @aws/agentcore
          agentcore deploy --runtime-name my-lab-agent \
            --image-uri ${{ needs.build-and-push.outputs.image }}
  diagnose-failure:
    needs: [build-and-push, evaluate-and-deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsAgentRole
          aws-region: ${{ env.AWS_REGION }}
      - env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          FAILED_JOBS: ${{ toJson(needs) }}
        run: |
          pip install boto3
          python .github/scripts/diagnose_failure.py \
            --job-context "$FAILED_JOBS" \
            --pr-number   "${{ github.event.pull_request.number }}"
